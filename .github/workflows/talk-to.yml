name: Talk To derleme

# Her push'ta: Linux testleri + .deb, Android testleri + APK (indirilebilir "artifact").
# "v" ile başlayan etiket (ör. v0.2.0) push edilince ayrıca GitHub Release açılır ve
# APK ile .deb oraya eklenir.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Talk To Android, ${{ matrix.os }})
    needs: android   # .deb, telefona USB'den kurulacak APK'yı içerir
    strategy:
      fail-fast: false
      matrix:
        # 22.04: GTK 4.6 + libadwaita 1.1 (uyumluluk katmanı), 24.04: GTK 4.14 + libadwaita 1.5
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: talk-to/linux
    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılıklar
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-cryptography gsettings-desktop-schemas xvfb imagemagick dbus libglib2.0-bin

      - name: Testler (arayüz uyumluluğu ve masaüstü medya oynatıcısı dahil, sanal ekran + D-Bus)
        # TALKTO_TEST_STRICT: ekran ya da D-Bus eksikse testler "atlandı" değil "başarısız" olur.
        run: TALKTO_TEST_STRICT=1 xvfb-run -a dbus-run-session -- /usr/bin/python3 -m unittest discover -s tests -v

      - name: Arayüz açılıyor mu (sanal ekranda ekran görüntüsü)
        # 22.04'ün PyGObject'i (3.42) GTK'nın çizim düğümlerini çeviremediği için orada pencere
        # X sunucusundan ImageMagick ile çekilir; ekran pencere sığacak kadar büyük olmalı.
        run: timeout 180 xvfb-run -a -s "-screen 0 1280x1400x24" env GSK_RENDERER=cairo NO_AT_BRIDGE=1 /usr/bin/python3 tests/ekran_goruntusu.py ekran 920 1300

      - name: Kurulum yardımcısı (sanal ekranda ekran görüntüsü)
        run: timeout 180 xvfb-run -a -s "-screen 0 1280x1400x24" env KURULUM=1 GSK_RENDERER=cairo NO_AT_BRIDGE=1 /usr/bin/python3 tests/ekran_goruntusu.py ekran 920 900

      - uses: actions/download-artifact@v4
        with:
          name: talk-to-linux-apk
          path: talk-to/linux/apk

      - name: .deb paketi (APK içinde; sır tanımlıysa imzalı)
        # Gizli anahtar yalnızca bu adımda var; dosyası adım bitmeden silinir.
        env:
          DEB_IMZA: ${{ secrets.TALKTO_DEB_IMZA_ANAHTARI }}
        run: |
          if [ -n "$DEB_IMZA" ]; then
            printf '%s\n' "$DEB_IMZA" > "$RUNNER_TEMP/deb-imza.asc"
            export DEB_IMZA_ANAHTARI="$RUNNER_TEMP/deb-imza.asc"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Etiketli sürüm imzasız .deb ile yayınlanamaz (TALKTO_DEB_IMZA_ANAHTARI sırrı yok)."
            exit 1
          else
            echo "::warning::TALKTO_DEB_IMZA_ANAHTARI sırrı yok: .deb imzasız üretiliyor."
          fi
          r=0
          sh paket/deb-olustur.sh "$(ls apk/talk-to-linux-*.apk | grep -v -e hafif -e play)" || r=$?
          rm -f "$RUNNER_TEMP/deb-imza.asc"
          exit $r

      - name: .deb imzası (sır varsa ya da etiketli sürümde imza zorunlu)
        env:
          IMZALI: ${{ secrets.TALKTO_DEB_IMZA_ANAHTARI != '' }}
        run: |
          if [ "$IMZALI" = "true" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 paket/deb-imzala.py dogrula paket/talk-to-android_*_all.deb
          else
            python3 paket/deb-imzala.py dogrula paket/talk-to-android_*_all.deb || true
          fi

      - name: Paket kurulup çalışıyor mu
        run: |
          sudo apt-get install -y -q ./paket/talk-to-android_*_all.deb
          talk-to-android yardim
          test -f /usr/share/talk-to-android/talk-to-linux.apk
          test -f /usr/share/talk-to-android/gnome-ada/45/metadata.json -a -f /usr/share/talk-to-android/gnome-ada/42/extension.js
          # Telefon uygulamasının sürümü pakette: telefondakiyle karşılaştırılır (bilgisayarın sürümüyle değil).
          test "$(cat /usr/share/talk-to-android/talk-to-linux.apk.surum)" = "$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' ../android/app/build.gradle.kts | head -n 1)"
          python3 -c "import json; k=json.load(open('/usr/share/keyrings/talk-to-android-paket.json')); assert k['yayinci'] and k['dogrulama'].startswith('https://')"
          grep -q "^X-Guncellenince-Yeniden-Baslar=true" /usr/share/applications/lab.crucible.TalkToAndroid.desktop
          grep -q "$(gpg --show-keys --with-colons paket/talk-to-android-paket.gpg | awk -F: '/^fpr/{print $10; exit}' | sed 's/..../& /g; s/ $//; s/\(.\{24\}\) /\1  /')" ../YAYINCI.txt

      - name: Kurulan uygulama açılıyor mu (arka plan çalışıyor, arayüzde hata yok)
        # Yalnızca "10 sn kapanmadı" yetmez: pencere istisna atsa da süreç açık kalır. Komut satırının
        # "durum" cevabı arka planın çalıştığını, stderr'de Traceback olmaması arayüzün açıldığını gösterir.
        run: |
          timeout 60 xvfb-run -a dbus-run-session -- sh -c '
            talk-to-android 2> "$RUNNER_TEMP/arayuz.txt" & app=$!
            sleep 8
            talk-to-android durum; r=$?
            kill $app 2>/dev/null
            cat "$RUNNER_TEMP/arayuz.txt"
            ! grep -q Traceback "$RUNNER_TEMP/arayuz.txt" && test $r -eq 0'


      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: talk-to-android-deb
          path: talk-to/linux/paket/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-ekran-goruntuleri-${{ matrix.os }}
          path: talk-to/linux/ekran/*.png

  ada:
    # Üst ada: gerçek GNOME Shell (sanal ekran, Wayland) içinde eklenti + gerçek Talk To (sahte telefon olayları).
    # Eklentideki düğmelere sanal fareyle basılır; Talk To'ya ulaşan eylemler ve ekran görüntüleri denetlenir.
    name: Üst ada (GNOME Shell eklentisi)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: talk-to/gnome-ada
    steps:
      - uses: actions/checkout@v4

      # GNOME Shell'in paketleri (~150 MB) çalışmalar arasında saklanır: Azure'un Ubuntu yansısı bazen çok yavaş
      # (bir kez 25 MB'lık paket 7 dakika sürdü, iş zaman aşımına uğradı).
      - uses: actions/cache@v4
        with:
          path: ~/apt-arsiv
          key: gnome-shell-apt-noble-${{ hashFiles('.github/workflows/talk-to.yml') }}
          restore-keys: gnome-shell-apt-noble-

      - name: Bağımlılıklar
        run: |
          mkdir -p ~/apt-arsiv/partial
          sudo apt-get update -q
          # Soru soran paket (ör. ekran yöneticisi seçimi) kurulumu bekletmesin; kurulum 25 dakikayla sınırlı.
          sudo DEBIAN_FRONTEND=noninteractive timeout 1500 apt-get install -y -q -o Dpkg::Options::=--force-confdef -o Dir::Cache::Archives="$HOME/apt-arsiv" gnome-shell gjs xwayland python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-cryptography gsettings-desktop-schemas dbus libglib2.0-bin
          sudo chown -R "$USER" ~/apt-arsiv  # önbelleğe kaydedilebilsin

      - name: Sözdizimi (GNOME 45+ ve 42–44 sürümleri)
        run: |
          python3 build.py "$RUNNER_TEMP/ada"
          gjs test/sozdizimi.js "$RUNNER_TEMP/ada/45/extension.js" modul
          gjs test/sozdizimi.js "$RUNNER_TEMP/ada/42/extension.js" betik

      - name: Uçtan uca
        run: PY=/usr/bin/python3 timeout 300 test/uctan_uca.sh "$RUNNER_TEMP/ada-test"

      - name: Mini oynatıcının ⋮ menüsü (Wayland ve üstte tutulurken XWayland)
        # Menü tıklanınca açık kalmalı, başka yere tıklanınca kapanmalı.
        run: |
          for top in 1 0; do
            timeout 200 test/kabukta.sh "$RUNNER_TEMP/ada-test" /usr/bin/python3 test/mini_menu.py ../linux "$RUNNER_TEMP/ada-test" $top || echo "kabuk çıkış kodu $?"
            cp "$RUNNER_TEMP/ada-test/surucu.log" "$RUNNER_TEMP/ada-test/mini-menu-$top.log" || true
          done
          for k in x11 wayland; do
            cat "$RUNNER_TEMP/ada-test/mini-menu-$k.json"; echo
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['open_after_click'] and d['closed_after_outside'] and d['closed_by_x'] and not d.get('errors'), d" "$RUNNER_TEMP/ada-test/mini-menu-$k.json"
          done
          grep -q X11Display "$RUNNER_TEMP/ada-test/mini-menu-x11.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ust-ada-ekran
          path: ${{ runner.temp }}/ada-test/

  android:
    name: Android (Talk To Linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: talk-to/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK bileşenleri
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Derle, birim testleri, lint (sır tanımlıysa kalıcı anahtarla imzalı)
        # Anahtar ve parola yalnızca bu adımda var; sonraki adımlara (GITHUB_ENV) taşınmaz.
        env:
          KEYSTORE_BASE64: ${{ secrets.TALKTO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TALKTO_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/talktolinux.jks"
            export TALKTO_KEYSTORE="$RUNNER_TEMP/talktolinux.jks" TALKTO_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            echo "Kalıcı anahtarla imzalanacak."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Etiketli sürüm kalıcı imza anahtarı olmadan yayınlanamaz (TALKTO_KEYSTORE_BASE64 sırrı yok)."
            exit 1
          else
            echo "::warning::TALKTO_KEYSTORE_BASE64 sırrı yok: APK her derlemede farklı geçici anahtarla imzalanır, eski sürümün üzerine kurulamaz."
          fi
          r=0
          ./gradlew --no-daemon assembleTamRelease assembleHafifRelease assemblePlayRelease bundlePlayRelease \
            testTamReleaseUnitTest lintTamRelease lintHafifRelease lintPlayRelease || r=$?
          rm -f "$RUNNER_TEMP/talktolinux.jks"
          exit $r

      - name: İmza sertifikası (etiketli sürümde kalıcı anahtar olmalı)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/*/release/*.apk; do
            "$signer" verify --print-certs "$apk" | tee /dev/stderr | grep -qi "SHA-256 digest: $TALKTO_CERT_SHA256" \
              || { echo "::error::$apk kalıcı anahtarla imzalanmamış"; exit 1; }
          done
        env:
          TALKTO_CERT_SHA256: 89ab48e123fe7920a774b9c95d737b008840b72d4a8a165a432b015f386eb424

      - name: Android ağ kodu ↔ gerçek Linux sunucusu (canlı test)
        run: sh ../linux/tests/android_canli_test.sh

      - name: APK'yı adlandır
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/tam/release/app-tam-release.apk "talk-to-linux-$v.apk"
          cp app/build/outputs/apk/hafif/release/app-hafif-release.apk "talk-to-linux-$v-hafif.apk"
          # Google Play'e uygun sürüm: deneme için APK, Play Console'a yüklemek için AAB (paket .deb'e girmez).
          cp app/build/outputs/apk/play/release/app-play-release.apk "talk-to-linux-$v-play.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "talk-to-linux-$v-play.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: talk-to-linux-apk
          path: |
            talk-to/android/talk-to-linux-*.apk
            talk-to/android/talk-to-linux-*.aab

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-raporlar
          path: |
            talk-to/android/app/build/reports/
            /tmp/talkto-canli.log

  emulator:
    # Gerçek Android'de uçtan uca: USB yolu, eşleşme, bildirim dinleyicisi, bildirimin bilgisayara
    # ulaşması, güncellemeden sonra yeniden bağlanma. Ekran görüntüleri "emulator-sonuc" içinde.
    name: Android emülatöründe uçtan uca
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: talk-to-linux-apk
          path: apk

      - name: KVM (emülatör hızlandırma)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Python bağımlılıkları
        run: sudo apt-get install -y -q python3-cryptography

      - name: Emülatörde test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash talk-to/linux/tests/emulator_e2e.sh "$(ls apk/talk-to-linux-*.apk | grep -v -e hafif -e play)" emulator-sonuc "$(ls apk/talk-to-linux-*-play.apk)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-sonuc
          path: emulator-sonuc/

  release:
    name: Sürüm yayınla
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android, emulator, ada]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: talk-to-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
            *.aab
            *.deb
